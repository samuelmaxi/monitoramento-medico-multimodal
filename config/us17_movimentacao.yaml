# US17 · Limiares das anomalias de movimentação durante a internação.
#
# Lido por movimentacao/config.py. Nenhum limiar fica no código: mudou um
# número aqui, suba "versao" (vai em evidence.thresholds de cada evento).

versao: "1.3.0"

# Fuso para separar dia de noite. O MIMIC-IV já vem com datas deslocadas e em
# UTC; numa câmera real use o fuso do hospital (ex.: America/Sao_Paulo).
fuso: "UTC"
noite: {inicio: "22:00", fim: "06:00"}

# Sem nenhuma observação por mais que isto, o trecho vira "desconhecido": não
# saber a posição não é o mesmo que o paciente estar imóvel.
lacuna_max_min: 150

imobilidade:
  # NPIAP/EPUAP/PPPIA (2019): reposicionar a cada ~2 h para prevenir lesão por
  # pressão. Dispara quando o trecho sem mudança passa estritamente do limiar.
  limiar_min: 120
  severidade: media
  # Escalonamento: a partir de N minutos, a severidade passa a ser esta.
  severidade_acima_de_min: {240: alta}

saida_leito:
  severidade_dia: media
  severidade_noite: alta

queda:
  severidade: alta
  # Quedas de fontes diferentes (pose, caixa da pessoa) a até este intervalo
  # são a mesma queda: um evento só, com as duas evidências.
  fusao_janela_s: 5

baseline:
  # Taxa de movimentação (mudanças de posição + saídas do leito por hora) das
  # últimas janela_atual_h comparada à mediana das taxas horárias das janela_h
  # anteriores, do próprio paciente.
  janela_h: 24
  janela_atual_h: 6
  # Com menos histórico observado que isto, não há baseline: nada é emitido.
  baseline_min_h: 12
  minimo_eventos_baseline: 3
  agitacao_fator: 2.0
  reducao_fator: 0.5
  severidade: media

score:
  # Score 0,5 no limiar de imobilidade, 1,0 quando o trecho chega a isto.
  saturacao_imobilidade_min: 240

# Vídeo de leito (US06 pose + US07 áreas + US08 quedas): movimentacao/video.py.
video:
  # Uma observação de posição por janela (a posição mais frequente nela), para
  # o esqueleto não oscilar quadro a quadro.
  janela_s: 1.0
  # Uma posição nova só conta como reposicionamento se durar isto. Esqueleto que
  # oscila entre supino e lateral por alguns quadros é ruído, não troca de posição.
  persistencia_s: 10
  # Inclinação do tronco (pescoço-quadril) em relação à vertical, convenção da
  # US06: abaixo disto o paciente está sentado/em pé; acima, deitado ou reclinado
  # (cabeceira elevada a 30-45 graus conta como deitado).
  inclinacao_sentado_max: 40
  # Deitado: largura dos ombros / comprimento do tronco abaixo disto = decúbito
  # lateral (os ombros se sobrepõem na imagem); acima = supino.
  razao_lateral_max: 0.35
  # ROI da US07 (config/leito_uti_07.json) que significa paciente fora do leito.
  area_fora_do_leito: lateral_leito
  # Queda pela caixa "person" do YOLOv8, segundo sinal além da pose (o relatório
  # da US08 mediu recall 0,23 só com pose). Duas regras, uma para cada queda:
  #
  # queda_descida: cair DO LEITO. Quem cai do leito já estava deitado (a caixa
  # já é larga), então o que muda é a posição: o centro da caixa desce na
  # imagem e fica embaixo. Calibrado na partição de calibração dos clipes de
  # leito do FallVision (data/eval/us17/quedas.csv): 0,065 é o maior limiar que
  # mantém recall 1,0 na calibração (recall tem prioridade, como na US08).
  queda_descida:
    descida_min_frac: 0.065  # descida do centro, em fração da altura do quadro
    tempo_max_s: 1.5         # dentro deste tempo
    janela_s: 0.5            # e fica embaixo por este tempo (ou até o fim do clipe)
    suavizacao_s: 0.3        # mediana móvel: um quadro espúrio não vira queda
  # queda_caixa: cair DE PÉ (indo ao banheiro). A caixa mais alta do último
  # tempo_max_s estava em pé, perde altura e fica mais larga que alta, rápido.
  queda_caixa:
    queda_altura_frac: 0.4   # altura cai pelo menos 40% da maior altura recente
    tempo_max_s: 1.0         # dentro deste tempo
    razao_deitado: 1.0       # e a caixa fica com largura/altura >= isto
    janela_s: 0.5            # mantido por este tempo
  # Detector da US07 (video/detector.py) para estas regras. Sem rastreamento: o
  # ByteTrack descarta caixas de baixa confiança, e pessoa deitada ou meio
  # coberta é exatamente o caso de baixa confiança. Medido nos 40 clipes de leito
  # (quadros com alguma pessoa): padrão da US07 (0,25, 640 px, ByteTrack) 40%,
  # estes valores 68%; só nos clipes de queda, 27% -> 58%.
  detector:
    confianca: 0.1
    imgsz: 960
    fps_max: 30              # clipes de 60/120 fps são amostrados a ~30 fps
