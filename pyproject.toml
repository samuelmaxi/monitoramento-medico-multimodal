[project]
name = "monitoramento-medico-multimodal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "samuelmaxi", email = "samuelgaraujo87@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-cognitiveservices-speech>=1.38.0",
    "azure-ai-textanalytics>=5.3.0",
    "azure-storage-blob>=12.25.0",
    "fastapi>=0.141.1",
    "gdown>=6.4.0",
    "numpy>=2.0",
    "opencv-python>=4.10.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.2",
    "ultralytics>=8.4.173",
    "uvicorn[standard]>=0.54.0",
    "opencv-python-headless==4.14.0.94",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "pydantic>=2.9",
    "lap>=0.5.12",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.23.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

